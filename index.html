<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>قرآن كريم</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet"href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <meta name="google-site-verification" content="WsAp2w6d20AR2xoll3J9dpbgd3McV4TE7vC09QXnuyg" />

    <style>
     
      /***basic***/
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      
      /* Light Mode */
      :root {
        --bg: #f8f7f1;
        --section-bg: #eef2ec;
        --card: #ffffff;

        --main-text: #16352a;
        --text: #718078;

        --primary: #246b50;
        --secondary: #b89550;

        --border: #dce5dc;
        --hover: #ddebe1;
        --icon: #246b50;
      }

      /* Dark Mode */
      .dark-mode {
        --bg: #0b1f19;
        --section-bg: #12352b;
        --card: #1b4035;

        --main-text: #f5f1e8;
        --text: #a9b8af;

        --primary: #d6b56d;
        --secondary: #e8d5a3;

        --border: #315447;
        --hover: #285344;
        --icon: #e8d5a3;
      }

      body {
        background-color: var(--bg);
        transition: 0.7s ease;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family:  "Tajawal", sans-serif;
      }

      section {
        display: flex;
        flex: 1;
        flex-direction: column;
      }

      /**Basic End**/

      /**Start  header & logo & theme button**/

      header .logo {
        width: 100%;
        background-color: var(--section-bg);
        transition: 0.5s ease;
        display: flex;
        justify-content: space-around;
      }

      header .logo a {
        text-decoration: none;
        font-size: 32px;
        font-weight: 700;
        color: var(--secondary);
        padding: 10px;
        display: inline-block;
        margin-top: 14px;
      }
     /****خطوط العناوين****/
      
      h3, header .logo span {
    font-family: "Cairo", sans-serif;
      }

      header .logo span {
        font-size: 32px;
        font-weight: 900;
        color: var(--primary);
        padding: 10px;
        transition: 0.7s ease;
      }
      header .logo span:hover {
        color: var(--secondary);
      }

      header .theme-btn {
        border: none;
        color: var(--main-text);
        background-color: transparent;
        font-size: 24px;
        font-weight: 600;
        align-items: center;
        cursor: pointer;
        transition: 0.4s ease;
      }
      header .theme-btn:hover {
        color: var(--text);
        transform: rotate(360deg);
      }

      /**End  header & logo & theme button**/

      /**Start main page **/

      .main-box {
        display: grid;
        justify-content: center;
        align-items: center;
        margin: 40px auto 0;
        flex-direction: column;
        max-width: 600px;
        flex: 1;
      }

      .card {
        margin-bottom: 30px;
        padding: 20px 40px;
        width: 100%;
        background-color: var(--card);
        text-decoration: none;
        text-align: center;
        border: 2px solid var(--border);
        border-radius: 12px;
        transition: 0.4s ease;
      }
      .card:hover {
        transform: scale(1.1);
        border: 2px solid var(--icon);
      }

      .card h3 {
        color: var(--primary);
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 10px;
        letter-spacing: 1px;
      }

      .card p {
        font-weight: 500;
        font-size: 14px;
        color: var(--main-text);
      }
      /***End  main page***/

      /**start  footer**/
      footer {
        display: inline-block;
        width: 100%;
        background-color: var(--section-bg);
        border: 1px solid var(--border);
        border-radius: 5px;
        display: flex;
        justify-content: center;
        justify-content: space-around;
        align-items: center;
        margin-bottom: 50px;
        transition: 0.3s ease;
      }

      footer p {
        color: var(--main-text);
        font-size: 24px;
        font-weight: 500;
        padding: 8px;
      }

      footer p span {
        color: var(--primary);
        font-weight: 700;
      }

      footer .social-icons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      footer .social-icons a {
        text-decoration: none;
        color: var(--icon);
        font-size: 20px;
        font-weight: 800;
        transition: 0.5s ease;

      }  
      footer .social-icons a:hover {
        color: var(--text);
      }
      /**end  footer**/


      
        /**image slider start**/
    .img-box {
       display: none;
    } 
        
      .slider-box {
         max-width: 1500px;
         width: 100%;
         height: 300px;
         overflow: hidden;
         border-radius: 20px;
         position: relative;
       }
      .slider-box img {
        opacity: 0;
        transition: 0.9s ease;
        position: absolute;
        width: 100%;
        height: 100%;
       object-fit: cover;
      }
      .slider-box img.active {
         opacity: 1;
      }

      .quran-title {
        text-align: center;
        font-family: "Aref Ruqaa", serif;
        font-size: 100px;
        font-weight: 700;
        color: var(--primary);
        margin-top: 20px;
        min-height: 90px;
      }
        
        /**image slider end**/

      /**All of  the media queries**/

  
  /****768 px*****/
        
      @media (max-width: 768px) {
        footer p {
          font-size: 16px;
        }
      }
/*****1023 px *****/
        
      @media (min-width: 1023px) {
        .main-box {
          margin-right: 18%;
          margin-left: auto;
        }

        .img-box {
          display: revert;
          width: 30%;
          position: absolute;
          left: 10%;
          top: 150px;
        }

        .big-logo {
          display: revert;
        }

        .card {
          margin-bottom: 10px;
        }
      }
      
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="https://ahmedtopone111-hash.github.io/Official-portfolio/">Leo</a>
        <button class="theme-btn" id="theme-btn">
          <i class="fa-solid fa-moon"></i>
        </button>
        <span>قرآن كريم</span>
      </div>
    </header>
    <section>
      <div class="main-box">
        <a href="main.html" class="card">
          <h3>استماع وتحميل</h3>
          <p>استمع لقارئك المفضل برواياته المختلفة </p>
        </a>
        <a href="#" class="card">
          <h3>قريبا</h3>
          <p></p>
        </a>
        <a href="about.html" class="card">
          <h3>حول المطور</h3>
          <p>بعض المعلومات عن مطور هذا الموقع</p>
        </a>
        <a href="contact.html" class="card">
          <h3>التواصل</h3>
          <p>المشاكل و الاقتراحات</p>
        </a>
      </div>

      <!--The img part start-->
      
   <div class="img-box"> 
      <div class="slider-box">
        <img src="img1.jpg" alt="">
        <img src="img2.jpg" alt="">
        <img src="img3.jpg" alt="">
        <img src="img4.jpg" alt="">
        <img src="img5.jpg" alt="">
      </div>
      
     <div class="quran-title" id="quranTitle"></div>
   </div>


      <!--The img part End-->


      
      
      <footer>
        <p>تم التطوير بواسطة <span>Leo</span> <i class="fa-solid fa-code"></i></p>
        <div class="social-icons">
          <a href="https://www.facebook.com/share/1Lg5QoAAvM/" target="_blank"><i class="fa-brands fa-facebook"></i></a>
          <a href="https://www.instagram.com/ahmed.dev1?igsi=a2QzdGV0d2RpMnVu"target="_blank"><i class="fa-brands fa-square-instagram"></i></a>
          <a href="https://github.com/ahmedtopone111-hash" target="_blank"><i class="fa-brands fa-github"></i></a>
        </div>
      </footer>
    </section>
    <script>
      const themeBtn = document.getElementById("theme-btn");    
      const themeIcon = themeBtn.querySelector("i");

themeBtn.addEventListener("click", () => {
  document.documentElement.classList.toggle("dark-mode");

  if (document.documentElement.classList.contains("dark-mode")) {
    themeIcon.className = "fa-solid fa-sun";
  } else {
    themeIcon.className = "fa-solid fa-moon";
  }

  console.log("Theme changed");
});
      

   // img slider
      const images = document.querySelectorAll(".slider-box img");

let currentImage = 0;

images[currentImage].classList.add("active");

setInterval(() => {
  images[currentImage].classList.remove("active");

  currentImage++;

  if (currentImage >= images.length) {
    currentImage = 0;
  }

  images[currentImage].classList.add("active");
}, 3000);

      //animation Quran title
      let word = "💙قرآن كريم";
      let i = 0;

      function typing() {
        quranTitle.textContent += word[i];
        i++;
      
        if (i == word.length) {
          clearInterval(timer);
     
          setTimeout(function() {
        quranTitle.textContent = "";
          i = 0;
        timer = setInterval(typing, 400);
             }, 4000);
           }
      }
      let quranTitle = document.getElementById("quranTitle");
      let timer = setInterval(typing,400);
        </script>
  </body>
</html>
